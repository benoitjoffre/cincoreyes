services:
  - type: web
    name: cinq-royaumes
    runtime: static
    buildCommand: pnpm --filter @cincoreyes/web build
    staticPublishPath: ./apps/web/dist
    envVars:
      - key: NODE_VERSION
        value: 22
      - key: VITE_SERVER_HOST
        fromService:
          type: web
          name: cinq-royaumes-server
          envVarKey: RENDER_EXTERNAL_HOSTNAME
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

  - type: web
    name: cinq-royaumes-server
    runtime: node
    plan: free
    buildCommand: corepack enable && pnpm install --frozen-lockfile && pnpm --filter @cincoreyes/server build
    startCommand: pnpm --filter @cincoreyes/server start
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: 22
      - key: CLIENT_HOST
        fromService:
          type: web
          name: cinq-royaumes
          envVarKey: RENDER_EXTERNAL_HOSTNAME
